<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SalesUncut — Dashboard Recruteur</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
  <style>
    .auth-overlay{position:fixed;inset:0;z-index:200;background:var(--ink);display:flex;align-items:center;justify-content:center;padding:24px}
    .auth-overlay.hidden{display:none}
    .auth-box{width:100%;max-width:460px;background:var(--cream);border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
    .auth-header{background:var(--ink);padding:28px 36px;display:flex;align-items:center;justify-content:space-between}
    .auth-logo{font-family:var(--font-display);font-weight:900;font-size:18px;color:var(--cream);text-transform:uppercase;letter-spacing:.05em;display:flex;align-items:center;gap:8px;text-decoration:none}
    .auth-logo .dot{width:8px;height:8px;background:var(--gold);border-radius:50%}
    .auth-badge{font-family:var(--font-mono);font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:var(--gold);border:1px solid var(--gold);padding:4px 10px;border-radius:20px}
    .auth-body{padding:36px}
    .auth-tabs{display:grid;grid-template-columns:1fr 1fr;border:1.5px solid var(--ink);border-radius:4px;overflow:hidden;margin-bottom:28px}
    .auth-tab{padding:12px;text-align:center;font-family:var(--font-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;background:var(--cream-2);color:var(--teal-3);border:none;transition:all .2s}
    .auth-tab.active{background:var(--ink);color:var(--cream)}
    .auth-form{display:flex;flex-direction:column;gap:16px}
    .form-group{display:flex;flex-direction:column;gap:6px}
    .form-label{font-family:var(--font-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--teal-3)}
    .form-input{padding:12px 16px;border:1.5px solid var(--cream-3);border-radius:4px;background:var(--cream);font-family:var(--font-sans);font-size:15px;color:var(--ink);transition:border-color .2s;outline:none}
    .form-input:focus{border-color:var(--gold-deep)}
    .form-input::placeholder{color:var(--teal-3)}
    .form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .auth-submit{margin-top:8px;padding:15px;background:var(--gold-deep);color:var(--cream);border:none;border-radius:4px;cursor:pointer;font-family:var(--font-mono);font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;transition:background .2s}
    .auth-submit:hover{background:var(--ink)}
    .auth-submit:disabled{opacity:.5;cursor:not-allowed}
    .auth-error{padding:12px 16px;background:rgba(179,78,42,.1);border:1px solid var(--rust);border-radius:4px;font-size:13px;color:var(--rust);display:none}
    .auth-error.visible{display:block}
    .auth-switch{text-align:center;margin-top:16px;font-size:13px;color:var(--teal-3)}
    .auth-switch a{color:var(--gold-deep);cursor:pointer;text-decoration:underline}
    .auth-overlay-inner{display:grid;grid-template-columns:1.1fr 0.9fr;gap:56px;align-items:center;max-width:980px;width:100%}
    .auth-pitch{color:var(--cream);padding-right:12px}
    .auth-pitch-eyebrow{font-family:var(--font-mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
    .auth-pitch-title{font-family:var(--font-display);font-weight:900;font-size:clamp(28px,3.2vw,42px);text-transform:uppercase;line-height:1.1;margin:16px 0 20px;color:var(--cream)}
    .auth-pitch-title .accent{color:var(--gold-deep);font-family:var(--font-serif);font-style:italic;text-transform:none;font-weight:400}
    .auth-pitch-lede{font-size:15px;line-height:1.6;color:rgba(255,248,231,.75);margin-bottom:24px;max-width:440px}
    .auth-pitch-list{list-style:none;display:flex;flex-direction:column;gap:12px;margin:0;padding:0}
    .auth-pitch-list li{font-size:14px;line-height:1.5;color:rgba(255,248,231,.85);padding-left:22px;position:relative}
    .auth-pitch-list li::before{content:'→';position:absolute;left:0;color:var(--gold)}
    @media (max-width:900px){.auth-overlay-inner{grid-template-columns:1fr;gap:32px;text-align:center}.auth-pitch{padding-right:0}.auth-pitch-list{text-align:left}}
    .dashboard{display:none}
    .dashboard.visible{display:block}
